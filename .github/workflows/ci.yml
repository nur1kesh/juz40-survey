name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: juz
          POSTGRES_PASSWORD: juzpw
          POSTGRES_DB: juz40
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juz -d juz40"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Тесттер (файл режимі)
        run: npm test
      - name: Тесттер (PostgreSQL)
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://juz:juzpw@localhost:5432/juz40
